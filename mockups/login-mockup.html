<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteelfangsDen — Login (Mockup)</title>
    <link type="text/css" rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link type="text/css" rel="stylesheet" href="../css/w95.css">
    <style>
        html, body { margin:0; padding:0; height:100%; background:#008081; }
        body { display:flex; align-items:center; justify-content:center; }
        .fmxw-400 { max-width: 400px; width: 100%; padding: 16px; }
        .auth-error { color:#c00; font-size:0.85em; margin-top:6px; }

        .discord-divider { text-align:center; margin:10px 0 8px; font-size:0.75rem; color:#888; position:relative; }
        .discord-divider::before, .discord-divider::after {
            content:''; position:absolute; top:50%; width:42%; height:1px; background:#aaa;
        }
        .discord-divider::before { left:0; } .discord-divider::after { right:0; }
        .btn-discord {
            display:flex; align-items:center; justify-content:center; width:100%;
            background:#5865F2; color:#fff; font-family:'Windows 95',sans-serif;
            font-size:0.82rem; padding:6px 10px; border:2px solid #4752c4;
            text-decoration:none; margin-bottom:4px;
        }

        /* Mockup label */
        .mock-tag {
            position: fixed; top: 10px; left: 10px;
            background: #000; color: #0f0; font-family: monospace;
            font-size: 11px; padding: 3px 8px; opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="mock-tag">MOCKUP — login page (index.html)</div>

<div class="fmxw-400">
    <div id="panel-login">
        <div class="card card-tertiary w-100">
            <div class="card-header text-center">
                <span>🖥️ Sign in</span>
            </div>
            <div class="card-body">
                <form autocomplete="off" class="mt-2" onsubmit="return false;">
                    <div class="form-group">
                        <label class="mb-2">Email</label>
                        <input type="email" class="form-control" value="amuro@steelfangsden.local" />
                    </div>
                    <div class="form-group">
                        <label class="mb-2">Password</label>
                        <input type="password" class="form-control" value="••••••••" />
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <label class="form-check-label">
                                <input class="form-check-input" type="checkbox" checked>
                                <span class="form-check-x"></span>
                                <span class="form-check-sign"></span>
                                Remember me
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-block btn-primary border-dark">
                        <span class="btn-text">Login</span>
                    </button>
                </form>
                <div class="d-flex justify-content-center mt-3">
                    <p class="m-0">Not registered?
                        <a href="#" class="font-weight-bold">Create account</a>
                    </p>
                </div>
                <div class="discord-divider">or</div>
                <a href="#" class="btn-discord">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 127.14 96.36" style="fill:#fff;vertical-align:middle;margin-right:6px;"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
                    Sign in with Discord
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
