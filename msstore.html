    // ── Storage helpers ───────────────────────────────────────────────────────
    var API = '';  // same origin

    // ── Filters ───────────────────────────────────────────────────────────────
    var _filter = { rarity:'All', faction:'All', era:'All', search:'' };

    window.msFilt = function () {
        _filter.rarity  = document.getElementById('ms-filter-rarity').value;
        _filter.faction = document.getElementById('ms-filter-faction').value;
        _filter.era     = document.getElementById('ms-filter-era').value;
        _filter.search  = document.getElementById('ms-search').value;
        renderCards();
    };

    // ── Equip ─────────────────────────────────────────────────────────────────
    window.msEquip = function (id) {
        var suit = MS_DATA.filter(function (s) { return s.id === id; })[0];
        if (!suit) return;

        fetch(API + '/api/character/equip', {
            method:      'POST',
            credentials: 'include',
            headers:     { 'Content-Type': 'application/json' },
            body:        JSON.stringify({ mobileSuit: suit.name })
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
            if (!res.ok) {
                alert(res.data.error || 'Could not equip suit.');
                return;
            }
            if (window.parent && window.parent !== window && typeof window.parent.onMSEquipped === 'function') {
                window.parent.onMSEquipped(suit.name);
            }
            alert('Active suit set to: ' + suit.name);
        })
        .catch(function () { alert('Could not reach the server.'); });
    };

    // ── Render ────────────────────────────────────────────────────────────────
    function renderCards() {
        var rarityColor = { Common:'#444', Uncommon:'#006400', Rare:'#00008B', 'Very Rare':'#8B008B' };

        var suits = MS_DATA.filter(function (s) {
            if (_filter.rarity  !== 'All' && s.rarity  !== _filter.rarity)  return false;
            if (_filter.faction !== 'All' && s.faction !== _filter.faction) return false;
            if (_filter.era     !== 'All' && s.era     !== _filter.era)     return false;
            if (_filter.search  && s.name.toLowerCase().indexOf(_filter.search.toLowerCase()) < 0) return false;
            return true;
        });

        if (suits.length === 0) {
            document.getElementById('card-area').innerHTML = '<p id="no-results">No suits found.</p>';
            return;
        }

        var html = '';
        suits.forEach(function (s) {
            html += '<div class="ms-card">';
            html += '<div class="ms-card-header">';
            html += '<strong>' + s.name + '</strong>';
            html += '<span style="color:' + rarityColor[s.rarity] + ';background:#fff;padding:0 4px;">' + s.rarity + ' · ' + s.faction + '</span>';
            html += '</div>';
            html += '<div class="ms-card-body">';

            // Image + stats side by side
            html += '<div style="display:flex;gap:8px;align-items:flex-start;">';
            html += '<img src="' + s.img + '" alt="' + s.name + '" style="width:90px;height:90px;object-fit:contain;background:#fff;border:2px inset #888;flex-shrink:0;" onerror="this.outerHTML=\'<div style=&quot;width:90px;height:90px;background:#c0c0c0;border:2px inset #888;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:2rem;&quot;>🤖</div>\'">';
            html += '<div style="flex:1;min-width:0;">';

            // Era + tags + meta
            html += '<div style="margin-bottom:4px;">';
            html += '<span class="era-badge">' + s.era + '</span>';
            s.tags.forEach(function (t) { html += '<span class="ms-tag">' + t + '</span>'; });
            html += ' <span style="font-size:0.7rem;">Size: ' + s.size + ' &nbsp;|&nbsp; Cost: ' + s.cost.toLocaleString() + ' G &nbsp;|&nbsp; Slots: ' + s.upgradeSlots + '</span>';
            html += '</div>';

            // Core stats
            html += '<div class="ms-stat-row">';
            html += '<div class="ms-stat"><div class="lbl">Armor Points</div><div class="val">' + s.ap + ' (T' + s.threshold + ')</div></div>';
            html += '<div class="ms-stat"><div class="lbl">Base Evasion</div><div class="val">' + s.evasion + '</div></div>';
            html += '<div class="ms-stat"><div class="lbl">Armor Die</div><div class="val">' + s.armorDie + '</div></div>';
            html += '</div>';

            // Ability scores
            html += '<div class="ms-stat-row">';
            html += '<div class="ms-stat"><div class="lbl">STR</div><div class="val">' + s.str + '</div></div>';
            html += '<div class="ms-stat"><div class="lbl">DEX</div><div class="val">' + s.dex + '</div></div>';
            html += '<div class="ms-stat"><div class="lbl">CON</div><div class="val">' + s.con + '</div></div>';
            html += '</div>';

            // Speed
            html += '<div class="ms-stat-row" style="grid-template-columns:repeat(4,1fr);">';
            html += '<div class="ms-stat"><div class="lbl">Land</div><div class="val">' + (s.speed.land || '—') + (s.speed.land ? 'm' : '') + '</div></div>';
            html += '<div class="ms-stat"><div class="lbl">Mid-Air</div><div class="val">' + (s.speed.air || '—') + (s.speed.air ? 'm' : '') + '</div></div>';
            html += '<div class="ms-stat"><div class="lbl">Zero-G</div><div class="val">' + s.speed.zeroG + 'm</div></div>';
            html += '<div class="ms-stat"><div class="lbl">Amph.</div><div class="val">' + (s.speed.amph || '—') + (s.speed.amph ? 'm' : '') + '</div></div>';
            html += '</div>';

            // Defences
            var defParts = [];
            if (s.immune.length)    defParts.push('Immune: ' + s.immune.join(', '));
            if (s.resistant.length) defParts.push('Resistant: ' + s.resistant.join(', '));
            if (defParts.length) html += '<p style="margin:3px 0;font-size:0.72rem;"><strong>Defenses:</strong> ' + defParts.join('; ') + '</p>';

            html += '<p style="margin:3px 0;font-size:0.72rem;"><strong>Fixed Equipment:</strong> ' + s.fixed + '</p>';
            if (s.notes) html += '<p style="margin:3px 0;font-size:0.7rem;color:#333;font-style:italic;">' + s.notes + '</p>';

            html += '<button class="btn btn-primary border-dark ms-equip-btn" onclick="msEquip(\'' + s.id + '\')">';
            html += '<span class="btn-text">⚙️ Set as Active Suit</span></button>';
            html += '</div></div></div></div>';
        });

        document.getElementById('card-area').innerHTML = html;
    }

    function render() {
        var rarities = ['All','Common','Uncommon','Rare','Very Rare'];
        var factions = ['All','Earth Federation','Principality of Zeon','AEUG','Titans','Neo Zeon','Londo Bell'];
        var eras     = ['All','One Year War','Stardust Memory','Gryps Conflict','Neo Zeon War',"Char's Counterattack",'Unicorn Era'];

        var html = '<div class="ms-filter-bar">';
        html += '<label>Rarity:</label><select id="ms-filter-rarity" onchange="msFilt()">';
        rarities.forEach(function (r) { html += '<option>' + r + '</option>'; });
        html += '</select>';
        html += '<label>Faction:</label><select id="ms-filter-faction" onchange="msFilt()">';
        factions.forEach(function (f) { html += '<option>' + f + '</option>'; });
        html += '</select>';
        html += '<label>Era:</label><select id="ms-filter-era" onchange="msFilt()">';
        eras.forEach(function (e) { html += '<option>' + e + '</option>'; });
        html += '</select>';
        html += '<input type="text" id="ms-search" placeholder="Search name..." oninput="msFilt()" style="width:100px;" />';
        html += '</div>';
        html += '<div id="card-area"></div>';
        html += '<p class="ms-footer">Official UC suit list sourced from <a href="https://gundam.fandom.com/wiki/Universal_Century_Mobile_Weapons" target="_blank">The Gundam Wiki</a>. '
              + '5e stats are fan-generated following the <a href="https://gundam5e.com" target="_blank">Gundam 5e</a> ruleset format.</p>';

        document.getElementById('store-root').innerHTML = html;
        renderCards();
    }

    render();

})();
</script>
</body>
</html>
