<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SteelfangsDen — Sign In</title>
    <!-- Bootstrap CSS -->
    <link type="text/css" rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- Win95 styles -->
    <link type="text/css" rel="stylesheet" href="css/w95.css">
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background-color: #008081;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fmxw-400 { max-width: 400px; width: 100%; padding: 16px; }

        .auth-error {
            color: #c00;
            font-size: 0.85em;
            margin-top: 6px;
            display: none;
        }

        /* ── Discord button ───────────────────────────────────────────────── */
        .discord-divider {
            text-align: center;
            margin: 10px 0 8px;
            font-size: 0.75rem;
            color: #888;
            position: relative;
        }
        .discord-divider::before,
        .discord-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #aaa;
        }
        .discord-divider::before { left: 0; }
        .discord-divider::after  { right: 0; }

        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: #5865F2;
            color: #fff;
            font-family: 'Windows 95', sans-serif;
            font-size: 0.82rem;
            padding: 6px 10px;
            border: 2px solid #4752c4;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .btn-discord:hover {
            background: #4752c4;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="fmxw-400">

    <!-- LOGIN PANEL -->
    <div id="panel-login">
        <div class="card card-tertiary w-100">
            <div class="card-header text-center">
                <span>🖥️ Sign in</span>
            </div>
            <div class="card-body">
                <form id="form-login" autocomplete="off" class="mt-2">
                    <div class="form-group">
                        <label for="login-email" class="mb-2">Email</label>
                        <input id="login-email" type="email" class="form-control" placeholder="Your email" required />
                    </div>
                    <div class="form-group">
                        <label for="login-password" class="mb-2">Password</label>
                        <input id="login-password" type="password" class="form-control" placeholder="Your password" required />
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <label class="form-check-label">
                                <input id="login-remember" class="form-check-input" type="checkbox">
                                <span class="form-check-x"></span>
                                <span class="form-check-sign"></span>
                                Remember me
                            </label>
                        </div>
                    </div>
                    <p class="auth-error" id="login-error">Incorrect email or password.</p>
                    <button type="submit" data-label="Login" class="btn btn-block btn-primary border-dark">
                        <span class="btn-text">Login</span>
                    </button>
                </form>
                <div class="d-flex justify-content-center mt-3">
                    <p class="m-0">Not registered?
                        <a href="#" id="go-register" class="font-weight-bold">Create account</a>
                    </p>
                </div>
                <div class="discord-divider">or</div>
                <a href="#" id="discord-login-btn" class="btn-discord" onclick="discordLogin(); return false;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 127.14 96.36" style="fill:#fff;vertical-align:middle;margin-right:6px;"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
                    Sign in with Discord
                </a>
            </div>
        </div>
    </div>

    <!-- REGISTER PANEL -->
    <div id="panel-register" style="display:none;">
        <div class="card card-tertiary w-100">
            <div class="card-header text-center">
                <span>🖥️ Create account</span>
            </div>
            <div class="card-body">
                <form id="form-register" autocomplete="off" class="mt-2">
                    <div class="form-group">
                        <label for="reg-username" class="mb-2">Username</label>
                        <input id="reg-username" type="text" class="form-control" placeholder="Your username" required />
                    </div>
                    <div class="form-group">
                        <label for="reg-email" class="mb-2">Email</label>
                        <input id="reg-email" type="email" class="form-control" placeholder="Your email" required />
                    </div>
                    <div class="form-group">
                        <label for="reg-password" class="mb-2">Password</label>
                        <input id="reg-password" type="password" class="form-control" placeholder="Choose a password" required />
                    </div>
                    <div class="form-group">
                        <label for="reg-password2" class="mb-2">Confirm Password</label>
                        <input id="reg-password2" type="password" class="form-control" placeholder="Repeat password" required />
                    </div>
                    <p class="auth-error" id="register-error">An error occurred.</p>
                    <button type="submit" data-label="Register" class="btn btn-block btn-primary border-dark">
                        <span class="btn-text">Register</span>
                    </button>
                </form>
                <div class="d-flex justify-content-center mt-3">
                    <p class="m-0">Already have an account?
                        <a href="#" id="go-login" class="font-weight-bold">Sign in</a>
                    </p>
                </div>
                <div class="discord-divider">or</div>
                <a href="#" class="btn-discord" onclick="discordLogin(); return false;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 127.14 96.36" style="fill:#fff;vertical-align:middle;margin-right:6px;"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
                    Register with Discord
                </a>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="node_modules/popper.js/dist/umd/popper.min.js"></script>
<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>

<script>
(function () {

    var API = '';  // same origin — server serves these files at localhost:3000

    function showError(id, msg) {
        var el = document.getElementById(id);
        el.textContent = msg;
        el.style.display = 'block';
    }
    function hideError(id) {
        document.getElementById(id).style.display = 'none';
    }
    function setLoading(btn, loading) {
        btn.disabled = loading;
        btn.querySelector('.btn-text').textContent = loading ? 'Please wait...' : btn.dataset.label;
    }

    // ── Already logged in — check server session ──────────────────────────────
    fetch(API + '/api/auth/session', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (user) {
            if (user) window.location.replace('desktop.html');
        })
        .catch(function () { /* server offline — stay on login page */ });

    // ── Panel switching ───────────────────────────────────────────────────────
    document.getElementById('go-register').addEventListener('click', function (e) {
        e.preventDefault();
        document.getElementById('panel-login').style.display = 'none';
        document.getElementById('panel-register').style.display = 'block';
        hideError('register-error');
    });
    document.getElementById('go-login').addEventListener('click', function (e) {
        e.preventDefault();
        document.getElementById('panel-register').style.display = 'none';
        document.getElementById('panel-login').style.display = 'block';
        hideError('login-error');
    });

    // ── Login ─────────────────────────────────────────────────────────────────
    document.getElementById('form-login').addEventListener('submit', function (e) {
        e.preventDefault();
        hideError('login-error');
        var btn      = this.querySelector('button[type=submit]');
        var email    = document.getElementById('login-email').value.trim().toLowerCase();
        var password = document.getElementById('login-password').value;

        setLoading(btn, true);
        fetch(API + '/api/auth/login', {
            method:      'POST',
            credentials: 'include',
            headers:     { 'Content-Type': 'application/json' },
            body:        JSON.stringify({ email: email, password: password })
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
            if (!res.ok) { showError('login-error', res.data.error || 'Login failed.'); return; }
            window.location.replace('desktop.html');
        })
        .catch(function () { showError('login-error', 'Could not reach the server. Is it running?'); })
        .finally(function () { setLoading(btn, false); });
    });

    // ── Register ──────────────────────────────────────────────────────────────
    document.getElementById('form-register').addEventListener('submit', function (e) {
        e.preventDefault();
        hideError('register-error');
        var btn       = this.querySelector('button[type=submit]');
        var username  = document.getElementById('reg-username').value.trim();
        var email     = document.getElementById('reg-email').value.trim().toLowerCase();
        var password  = document.getElementById('reg-password').value;
        var password2 = document.getElementById('reg-password2').value;

        if (password !== password2) { showError('register-error', 'Passwords do not match.'); return; }

        setLoading(btn, true);
        fetch(API + '/api/auth/register', {
            method:      'POST',
            credentials: 'include',
            headers:     { 'Content-Type': 'application/json' },
            body:        JSON.stringify({ username: username, email: email, password: password })
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
            if (!res.ok) { showError('register-error', res.data.error || 'Registration failed.'); return; }
            window.location.replace('desktop.html');
        })
        .catch(function () { showError('register-error', 'Could not reach the server. Is it running?'); })
        .finally(function () { setLoading(btn, false); });
    });

    // ── Discord OAuth2 stub ───────────────────────────────────────────────────
    var DISCORD_CLIENT_ID = 'YOUR_CLIENT_ID_HERE';
    var DISCORD_REDIRECT  = window.location.origin + '/auth/discord/callback';

    window.discordLogin = function () {
        if (DISCORD_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
            alert('Discord login is not yet configured.\nSee discordsetup.html for setup instructions.');
            return;
        }
        var url = 'https://discord.com/api/oauth2/authorize'
            + '?client_id=' + DISCORD_CLIENT_ID
            + '&redirect_uri=' + encodeURIComponent(DISCORD_REDIRECT)
            + '&response_type=code'
            + '&scope=identify%20email';
        window.location.href = url;
    };

})();
</script>
</body>
</html>
